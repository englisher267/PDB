<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哲学大図鑑</title>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #f4f1ec;
  --surface:  #ffffff;
  --accent:   #4d6e5b;
  --accent2:  #3a5445;
  --dark:     #1c2a22;
  --text:     #1a1a1a;
  --muted:    #888;
  --border:   #e0dbd3;
  --radius:   14px;
}
html, body { height: 100%; }
body {
  font-family: 'Hiragino Kaku Gothic ProN','Noto Sans JP','Hiragino Sans',sans-serif;
  background: var(--bg);
  color: var(--text);
  min-width: 1100px;
  overflow-x: hidden;
}

/* ===== SCREENS ===== */
.screen { display: none !important; }
.screen.active { display: flex !important; flex-direction: column; min-height: 100vh; }

/* ===== MOBILE BLOCK ===== */
#mobile-block {
  display: none;
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 32px; gap: 12px;
}
#mobile-block.show { display: flex; }
#mobile-block .icon { font-size: 52px; }
#mobile-block h2 { font-size: 20px; }
#mobile-block p { font-size: 14px; color: var(--muted); line-height: 1.8; }

/* ===== BROWSE SCREEN ===== */
/* Header */
.browse-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 48px;
  height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 40;
}
.logo { font-size: 15px; font-weight: 800; color: var(--accent); letter-spacing: .04em; display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 26px; height: 26px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.logo-mark svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2; }
.header-sub { font-size: 12px; color: var(--muted); }

/* Hero */
.browse-hero {
  background: var(--dark);
  padding: 60px 48px 52px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 40px;
}
.hero-left {}
.hero-eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.45); margin-bottom: 14px; }
.hero-title { font-size: clamp(28px, 3.5vw, 44px); font-weight: 800; color: #fff; line-height: 1.25; margin-bottom: 16px; }
.hero-title em { color: #8ab89a; font-style: normal; }
.hero-desc { font-size: 14px; color: rgba(255,255,255,.6); line-height: 1.9; max-width: 480px; }
.hero-stats { display: flex; gap: 32px; flex-shrink: 0; }
.stat { text-align: right; }
.stat-num { font-size: 36px; font-weight: 800; color: #8ab89a; line-height: 1; }
.stat-label { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 4px; }

/* Filter tabs */
.filter-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 48px;
  display: flex; gap: 0;
  position: sticky; top: 58px; z-index: 40;
}
.ftab {
  padding: 16px 22px;
  font-size: 13px; font-family: inherit; font-weight: 600;
  background: none; border: none; border-bottom: 3px solid transparent;
  color: var(--muted); cursor: pointer;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.ftab:hover { color: var(--accent); }
.ftab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Category section headers */
.browse-body { padding: 48px 48px 80px; }
.cat-section { margin-bottom: 52px; }
.cat-header {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 20px;
}
.cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.cat-name { font-size: 13px; font-weight: 700; letter-spacing: .08em; }
.cat-count { font-size: 12px; color: var(--muted); margin-left: auto; }

/* Theme cards */
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.tcard {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 0;
  cursor: pointer;
  border: 1.5px solid var(--border);
  transition: transform .2s, box-shadow .2s, border-color .2s;
  overflow: hidden;
  display: flex; flex-direction: column;
}
.tcard:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 36px rgba(0,0,0,.12);
  border-color: var(--accent);
}
.tcard-color-bar { height: 6px; flex-shrink: 0; }
.tcard-body { padding: 20px 20px 18px; flex: 1; display: flex; flex-direction: column; }
.tcard-cat { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; opacity: .7; }
.tcard-title { font-size: 15px; font-weight: 700; line-height: 1.55; flex: 1; margin-bottom: 14px; }
.tcard-foot { display: flex; align-items: center; justify-content: space-between; }
.tcard-count { font-size: 11px; color: var(--muted); }
.tcard-arrow {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  opacity: 0; transition: opacity .2s;
}
.tcard:hover .tcard-arrow { opacity: 1; }

/* Category palette */
.c-人間関係  { --cc: #4d6e5b; }
.c-自分自身  { --cc: #6b5e9a; }
.c-仕事・夢  { --cc: #b07a32; }
.c-人生の問い { --cc: #3070a0; }
.c-社会・未来 { --cc: #963a5c; }
.cat-dot   { background: var(--cc); }
.tcard-cat { color: var(--cc); }
.tcard-color-bar { background: var(--cc); }

/* ===== SPIDER SCREEN ===== */
#screen-spider { flex-direction: row !important; height: 100vh; overflow: hidden; }

/* Sidebar */
.spider-side {
  width: 320px; flex-shrink: 0;
  background: var(--dark);
  display: flex; flex-direction: column;
  height: 100vh; overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.1) transparent;
}
.spider-side::-webkit-scrollbar { width: 4px; }
.spider-side::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }

.side-top { padding: 28px 28px 0; }
.btn-back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-family: inherit; font-weight: 600;
  color: rgba(255,255,255,.5); background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px; padding: 7px 14px; cursor: pointer;
  transition: all .15s; letter-spacing: .04em;
  text-transform: uppercase;
}
.btn-back:hover { color: #fff; background: rgba(255,255,255,.13); }

.side-theme-cat { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-top: 28px; margin-bottom: 8px; color: rgba(255,255,255,.4); }
.side-theme-name { font-size: 22px; font-weight: 800; color: #fff; line-height: 1.4; }
.side-divider { border: none; border-top: 1px solid rgba(255,255,255,.08); margin: 24px 0; }

/* Genre legend */
.side-legend { padding: 0 28px; }
.legend-title { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.35); margin-bottom: 10px; }
.legend-list { display: flex; flex-direction: column; gap: 7px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,.55); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* Philosophy journal */
.side-journal { padding: 24px 28px 0; flex: 1; }
.journal-title { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 6px; }
.journal-sub { font-size: 12px; color: rgba(255,255,255,.4); margin-bottom: 14px; line-height: 1.7; }
.journal-textarea {
  width: 100%; background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px; padding: 12px 14px;
  font-size: 13px; font-family: inherit; color: #fff;
  resize: none; outline: none; min-height: 100px;
  transition: border .15s; line-height: 1.7;
}
.journal-textarea::placeholder { color: rgba(255,255,255,.25); }
.journal-textarea:focus { border-color: #8ab89a; }
.journal-save {
  margin-top: 10px; width: 100%; padding: 10px;
  background: var(--accent); color: #fff; border: none;
  border-radius: 8px; font-size: 13px; font-family: inherit;
  font-weight: 600; cursor: pointer; transition: background .15s;
}
.journal-save:hover { background: var(--accent2); }

/* History */
.side-history { padding: 20px 28px 40px; }
.history-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.3); margin-bottom: 12px; }
.hist-item {
  background: rgba(255,255,255,.05);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,.07);
}
.hist-meta { font-size: 11px; color: rgba(255,255,255,.35); margin-bottom: 5px; }
.hist-text { font-size: 13px; color: rgba(255,255,255,.7); line-height: 1.6; }

/* Canvas area */
.spider-canvas-wrap {
  flex: 1; position: relative; overflow: hidden;
  background: var(--bg);
}
#spider-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.nodes-layer { position: absolute; inset: 0; pointer-events: none; }

/* Center node */
.center-node {
  position: absolute; transform: translate(-50%, -50%);
  pointer-events: none; text-align: center; z-index: 5;
}
.center-circle {
  width: 160px; height: 160px; border-radius: 50%;
  background: var(--dark);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 8px 40px rgba(0,0,0,.18);
  padding: 20px;
}
.center-text { font-size: 16px; font-weight: 800; color: #fff; line-height: 1.45; }
.center-hint { font-size: 10px; color: rgba(255,255,255,.45); margin-top: 8px; letter-spacing: .06em; }

/* Quote nodes */
.qnode {
  position: absolute; transform: translate(-50%, -50%);
  background: var(--surface); border-radius: 50%;
  border: 2px solid var(--border);
  cursor: pointer; pointer-events: all;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 14px;
  transition: transform .22s, box-shadow .22s, border-color .22s;
  box-shadow: 0 3px 18px rgba(0,0,0,.07);
}
.qnode:hover {
  transform: translate(-50%, -50%) scale(1.06);
  box-shadow: 0 10px 40px rgba(0,0,0,.15);
  border-color: var(--accent); z-index: 20;
}
.qnode-badge {
  font-size: 9px; font-weight: 700; border-radius: 20px;
  padding: 2px 8px; color: #fff; margin-bottom: 6px; flex-shrink: 0;
}
.qnode-text { font-size: 11px; line-height: 1.55; color: var(--text); overflow: hidden; }
.author-tag {
  position: absolute; transform: translate(-50%, -50%);
  font-size: 11px; color: var(--muted);
  white-space: nowrap; pointer-events: none;
  background: rgba(244,241,236,.82); padding: 2px 6px; border-radius: 4px;
}

/* Genre colours */
.g-哲学    { background: #4d6e5b; }
.g-文学    { background: #6b5e9a; }
.g-仏教    { background: #b07a32; }
.g-心理学  { background: #3070a0; }
.g-詩      { background: #963a5c; }
.g-日本の古典 { background: #5a9a3a; }

/* ===== DETAIL OVERLAY ===== */
#overlay {
  display: none; position: fixed; inset: 0;
  z-index: 200; align-items: stretch; justify-content: flex-end;
  background: rgba(20,30,24,.45);
}
#overlay.active { display: flex; }
.detail-panel {
  width: 500px; background: var(--surface);
  display: flex; flex-direction: column;
  box-shadow: -8px 0 48px rgba(0,0,0,.15);
  animation: slideIn .25s ease;
  overflow-y: auto;
}
@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
.detail-head {
  padding: 28px 32px 0;
  display: flex; align-items: flex-start; justify-content: space-between;
}
.detail-close {
  background: none; border: 1.5px solid var(--border); border-radius: 8px;
  width: 36px; height: 36px; font-size: 18px; cursor: pointer;
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  transition: border-color .15s; flex-shrink: 0;
}
.detail-close:hover { border-color: var(--accent); color: var(--accent); }
.d-genre {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; border-radius: 20px;
  padding: 4px 12px; color: #fff;
}
.detail-body { padding: 24px 32px 40px; flex: 1; }
.d-quote {
  font-size: clamp(18px, 2vw, 24px); font-weight: 800;
  line-height: 1.65; border-left: 4px solid var(--accent);
  padding-left: 18px; margin-bottom: 16px;
}
.d-source { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 24px; line-height: 1.6; }
.d-explanation { font-size: 14px; line-height: 1.9; margin-bottom: 28px; }
.d-divider { border: none; border-top: 1px solid var(--border); margin-bottom: 24px; }
.d-prompt { font-size: 12px; color: var(--muted); margin-bottom: 10px; font-weight: 600; letter-spacing: .04em; }
.d-textarea {
  width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
  padding: 13px 15px; font-size: 14px; font-family: inherit;
  background: var(--bg); color: var(--text); outline: none;
  resize: none; min-height: 90px; transition: border .15s; line-height: 1.7;
}
.d-textarea:focus { border-color: var(--accent); }
.d-save-row { display: flex; justify-content: flex-end; margin-top: 12px; }
.btn-accent {
  padding: 10px 24px; background: var(--accent); color: #fff;
  border: none; border-radius: 10px; font-size: 13px;
  font-family: inherit; font-weight: 700; cursor: pointer;
  transition: background .15s;
}
.btn-accent:hover { background: var(--accent2); }
.d-status { font-size: 13px; color: var(--accent); margin-top: 8px; min-height: 16px; }

/* ===== LOADING ===== */
#loading {
  display: none; position: fixed; inset: 0; z-index: 999;
  background: rgba(244,241,236,.85);
  align-items: center; justify-content: center;
}
#loading.active { display: flex; }
.spinner {
  width: 40px; height: 40px; border-radius: 50%;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Mobile block -->
<div id="mobile-block">
  <div class="icon">💻</div>
  <h2>パソコンでご覧ください</h2>
  <p>このアプリはデスクトップ向けに設計されています。<br>PCブラウザからアクセスしてください。</p>
</div>

<!-- Loading -->
<div id="loading"><div class="spinner"></div></div>

<!-- ═══════════════════════ BROWSE SCREEN ═══════════════════════ -->
<section class="screen active" id="screen-browse">

  <header class="browse-header">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5"/><line x1="7" y1="2" x2="7" y2="7"/><line x1="7" y1="7" x2="11" y2="9"/></svg>
      </div>
      哲学大図鑑
    </div>
    <div class="header-sub">30テーマ・300の言葉</div>
  </header>

  <div class="browse-hero">
    <div class="hero-left">
      <div class="hero-eyebrow">Philosophy Database</div>
      <h1 class="hero-title">今の<em>悩み</em>に近い<br>テーマを選んでください</h1>
      <p class="hero-desc">哲学・文学・仏教・心理学など、古今東西の言葉があなたの悩みに静かに語りかけます。</p>
    </div>
    <div class="hero-stats">
      <div class="stat"><div class="stat-num">30</div><div class="stat-label">テーマ</div></div>
      <div class="stat"><div class="stat-num">300</div><div class="stat-label">の言葉</div></div>
      <div class="stat"><div class="stat-num">6</div><div class="stat-label">ジャンル</div></div>

  <nav class="filter-bar">
    <button class="ftab active" data-cat="all">すべて</button>
    <button class="ftab" data-cat="人間関係">人間関係</button>

    <button class="ftab" data-cat="仕事・夢">仕事・夢</button>

    <button class="ftab" data-cat="社会・未来">社会・未来</button>
  </nav>

  <div class="browse-body" id="browse-body"></div>

</section>

<!-- ═══════════════════════ SPIDER SCREEN ═══════════════════════ -->
<section class="screen" id="screen-spider">

  <!-- Sidebar -->
  <aside class="spider-side">
    <div class="side-top">
      <button class="btn-back" onclick="showBrowse()">← 一覧へ戻る</button>
      <div class="side-theme-cat" id="side-cat"></div>
      <div class="side-theme-name" id="side-name"></div>

    <div class="side-legend">
      <div class="legend-title">ジャンル</div>
      <div class="legend-list">
        <div class="legend-item"><div class="legend-dot g-哲学"></div>哲学</div>
        <div class="legend-item"><div class="legend-dot g-文学"></div>文学</div>
        <div class="legend-item"><div class="legend-dot g-仏教"></div>仏教</div>
        <div class="legend-item"><div class="legend-dot g-心理学"></div>心理学</div>
        <div class="legend-item"><div class="legend-dot g-詩"></div>詩</div>

      <div class="journal-sub">言葉たちと向き合って、<br>あなた自身の言葉を残してみてください。</div>
      <textarea class="journal-textarea" id="journal-text" placeholder="感じたこと、気づいたことを…" rows="5"></textarea>
      <button class="journal-save" onclick="saveJournal()">保存する</button>

        <div class="center-hint">クリックして詳細へ</div>
      </div>
    </div>
  </div>

</section>

<!-- ═══════════════════════ DETAIL PANEL ═══════════════════════ -->
<div id="overlay" onclick="closeDetail(event)">
  <div class="detail-panel" id="detail-panel">
    <div class="detail-head">
      <div class="d-genre" id="d-genre"></div>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body">
      <div class="d-quote" id="d-quote"></div>
      <div class="d-source" id="d-source"></div>
      <div class="d-explanation" id="d-explanation"></div>
      <div class="d-divider"></div>
      <div class="d-prompt">この言葉を読んで、あなたはどう思いますか？</div>
      <textarea class="d-textarea" id="d-textarea" placeholder="感じたこと、気づいたことを自由に…" rows="4"></textarea>
      <div class="d-save-row">
        <button class="btn-accent" onclick="saveNote()">振り返りを保存</button>
      </div>
      <div class="d-status" id="d-status"></div>
    </div>
  </div>
</div>

<script>
/* ═══════════════ DATA ═══════════════ */
const CATS = {
  '人間関係':  { ids: ['comparison','loneliness','people_pleasing','unforgiving','jealousy','relationship_reset','cant_be_honest'], color: '#4d6e5b' },
  '自分自身':  { ids: ['identity_lost','no_confidence','self_dislike','emotional_control','perfectionism','past_regret'], color: '#6b5e9a' },
  '仕事・夢':  { ids: ['work_meaningless','career_change','effort_unrewarded','work_purpose','dream_abandon','no_purpose'], color: '#b07a32' },
  '人生の問い':{ ids: ['life_meaning','happiness_unknown','death_thoughts','time_wasted','choice_regret'], color: '#3070a0' },
  '社会・未来':{ ids: ['world_dissatisfaction','money_happiness','ai_era','no_correct_answer','powerlessness','fear_of_change'], color: '#963a5c' },
};
const ID2CAT = {};
Object.entries(CATS).forEach(([cat,{ids}]) => ids.forEach(id => ID2CAT[id] = cat));

let DB = null, currentTheme = null, currentEntry = null;

/* ═══════════════ INIT ═══════════════ */
window.addEventListener('DOMContentLoaded', async () => {
  if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 900)
    document.getElementById('mobile-block').classList.add('show');

  document.getElementById('loading').classList.add('active');
  try {
    const r = await fetch('./philosophy-database.json');
    if (r.ok) DB = await r.json();
  } catch(e) {}
  document.getElementById('loading').classList.remove('active');

  buildBrowse('all');

  // filter tabs
  document.querySelectorAll('.ftab').forEach(t =>
    t.addEventListener('click', () => {
      document.querySelectorAll('.ftab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      buildBrowse(t.dataset.cat);
    })
  );
});

/* ═══════════════ BROWSE ═══════════════ */
function buildBrowse(filterCat) {
  if (!DB) return;
  const body = document.getElementById('browse-body');
  body.innerHTML = '';

  const cats = filterCat === 'all' ? Object.keys(CATS) : [filterCat];
  cats.forEach(cat => {
    const {ids, color} = CATS[cat];
    const themes = DB.themes.filter(t => ids.includes(t.id));
    if (!themes.length) return;

    const sec = document.createElement('div');
    sec.className = `cat-section c-${cat}`;
    sec.innerHTML = `
      <div class="cat-header">
        <div class="cat-dot"></div>
        <div class="cat-name">${cat}</div>
        <div class="cat-count">${themes.length}テーマ</div>
      </div>
      <div class="theme-grid" id="grid-${cat}"></div>
    `;
    body.appendChild(sec);

    const grid = sec.querySelector('.theme-grid');
    themes.forEach(theme => {
      const cnt = DB.entries.filter(e => e.theme_id === theme.id).length;
      const card = document.createElement('div');
      card.className = `tcard c-${cat}`;
      card.innerHTML = `
        <div class="tcard-color-bar"></div>
        <div class="tcard-body">
          <div class="tcard-cat">${cat}</div>
          <div class="tcard-title">${theme.label}</div>
          <div class="tcard-foot">
            <div class="tcard-count">${cnt}の言葉</div>
            <div class="tcard-arrow">→</div>
          </div>
        </div>
      `;
      card.onclick = () => openSpider(theme.id, theme.label, cat);
      grid.appendChild(card);
    });
  });
}

/* ═══════════════ SPIDER ═══════════════ */
function openSpider(themeId, themeLabel, cat) {
  currentTheme = { id: themeId, label: themeLabel, cat };
  document.getElementById('side-cat').textContent = cat;
  document.getElementById('side-name').textContent = themeLabel;
  document.getElementById('center-text').textContent = themeLabel;
  document.getElementById('journal-text').value = '';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-spider').classList.add('active');
  requestAnimationFrame(() => { requestAnimationFrame(renderSpider); });
  renderHistory();
}

function showBrowse() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-browse').classList.add('active');
}

/* ─── Seeded RNG ─── */
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s = Math.imul(s, 1664525) + 1013904223 | 0; return (s >>> 0) / 0xffffffff; };
}
function hash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = Math.imul(h, 31) + str.charCodeAt(i) | 0;
  return h >>> 0;
}

/* ─── Force-directed collision resolution ─── */
function resolveCollisions(pts, sizes, W, H, cx, cy) {
  const PAD = 28;
  for (let iter = 0; iter < 120; iter++) {
    // node-node repulsion
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[j].x - pts[i].x, dy = pts[j].y - pts[i].y;
        const d = Math.hypot(dx, dy) || .01;
        const minD = (sizes[i] + sizes[j]) / 2 + PAD;
        if (d < minD) {
          const push = (minD - d) / 2;
          pts[i].x -= dx / d * push; pts[i].y -= dy / d * push;
          pts[j].x += dx / d * push; pts[j].y += dy / d * push;
        }
      }
      // center repulsion
      const dcx = pts[i].x - cx, dcy = pts[i].y - cy;
      const dc = Math.hypot(dcx, dcy) || .01;
      if (dc < 100) {
        const push = (100 - dc) / 2;
        pts[i].x += dcx / dc * push; pts[i].y += dcy / dc * push;
      }
    }
    // clamp
    pts.forEach((p, i) => {
      const pad = sizes[i] / 2 + 14;
      p.x = Math.max(pad, Math.min(W - pad, p.x));
      p.y = Math.max(pad, Math.min(H - pad, p.y));
    });
  }
}

function renderSpider() {
  if (!DB || !currentTheme) return;
  const entries = DB.entries.filter(e => e.theme_id === currentTheme.id);
  const wrap = document.getElementById('spider-canvas');
  const W = wrap.offsetWidth, H = wrap.offsetHeight;
  const cx = W / 2, cy = H / 2;

  const r = rng(hash(currentTheme.id));

  // Varied node sizes: 3 tiers
  const SIZE_TIERS = [150, 125, 105];
  const sizes = entries.map((_, i) => SIZE_TIERS[i % 3]);

  // Two-ring initial placement for variety
  const INNER = 4, OUTER = entries.length - INNER;
  const rInner = Math.min(W, H) * 0.22;
  const rOuter = Math.min(W, H) * 0.40;

  const pts = entries.map((_, i) => {
    let angle, rad;
    if (i < INNER) {
      angle = (2 * Math.PI * i / INNER) - Math.PI / 2 + (r() - .5) * .5;
      rad   = rInner * (0.88 + r() * .24);
    } else {
      const j = i - INNER;
      angle = (2 * Math.PI * j / OUTER) - Math.PI / 3 + (r() - .5) * .45;
      rad   = rOuter * (0.88 + r() * .24);
    }
    return { x: cx + rad * Math.cos(angle), y: cy + rad * Math.sin(angle) };
  });

  resolveCollisions(pts, sizes, W, H, cx, cy);

  // Render SVG
  const svg = document.getElementById('spider-svg');
  svg.innerHTML = '';

  // Background rings
  [.16, .30, .44].forEach(f => {
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy);
    c.setAttribute('r', Math.min(W,H) * f);
    c.setAttribute('fill','none'); c.setAttribute('stroke','#e5e0d8'); c.setAttribute('stroke-width','1');
    svg.appendChild(c);
  });

  // Lines (draw first)
  entries.forEach((_, i) => {
    const {x, y} = pts[i];
    // Curved line via quadratic bezier
    const mx = (cx + x) / 2 + (y - cy) * .08;
    const my = (cy + y) / 2 - (x - cx) * .08;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${cx},${cy} Q${mx},${my} ${x},${y}`);
    path.setAttribute('stroke','#d8d2ca'); path.setAttribute('stroke-width','1.2');
    path.setAttribute('fill','none');
    svg.appendChild(path);
  });

  // Center node position
  document.getElementById('center-node').style.left = cx + 'px';
  document.getElementById('center-node').style.top  = cy + 'px';

  // Nodes
  const layer = document.getElementById('nodes-layer');
  layer.innerHTML = '';

  entries.forEach((entry, i) => {
    const {x, y} = pts[i];
    const sz = sizes[i];

    // Author label — midpoint
    const mx = cx + (x - cx) * .58;
    const my = cy + (y - cy) * .58;
    const al = document.createElement('div');
    al.className = 'author-tag';
    al.style.left = mx + 'px'; al.style.top = my + 'px';
    al.textContent = entry.author;
    layer.appendChild(al);

    // Node
    const node = document.createElement('div');
    node.className = 'qnode';
    node.style.left = x + 'px'; node.style.top = y + 'px';
    node.style.width = sz + 'px'; node.style.height = sz + 'px';

    const maxCh = Math.floor(sz / 5.8);
    const txt = entry.text.length > maxCh ? entry.text.slice(0, maxCh - 1) + '…' : entry.text;

    node.innerHTML = `
      <div class="qnode-badge g-${entry.genre}">${entry.genre}</div>
      <div class="qnode-text">${txt}</div>
    `;
    node.onclick = () => openDetail(entry);
    layer.appendChild(node);
  });
}

window.addEventListener('resize', () => {
  if (document.getElementById('screen-spider').classList.contains('active')) renderSpider();
});

/* ═══════════════ DETAIL PANEL ═══════════════ */
function openDetail(entry) {
  currentEntry = entry;
  document.getElementById('d-genre').textContent = entry.genre;
  document.getElementById('d-genre').className = `d-genre g-${entry.genre}`;
  document.getElementById('d-quote').textContent = entry.text;
  document.getElementById('d-source').textContent = `${entry.author}（『${entry.source}』${entry.year}）`;
  document.getElementById('d-explanation').textContent = entry.explanation;
  document.getElementById('d-textarea').value = '';
  document.getElementById('d-status').textContent = '';
  document.getElementById('overlay').classList.add('active');
}

function closeDetail(e) {
  if (!e || e.target === document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('active');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

function saveNote() {
  const txt = document.getElementById('d-textarea').value.trim();
  if (!txt || !currentEntry) return;
  push({ date: today(), theme: currentTheme.label, quote: currentEntry.text, author: currentEntry.author, text: txt });
  document.getElementById('d-status').textContent = '✓ 保存しました';
  renderHistory();
}

/* ═══════════════ JOURNAL ═══════════════ */
function saveJournal() {
  const txt = document.getElementById('journal-text').value.trim();
  if (!txt) return;
  push({ date: today(), theme: currentTheme.label, text: txt });
  document.getElementById('journal-text').value = '';
  renderHistory();
}

function push(rec) {
  const recs = JSON.parse(localStorage.getItem('phil_records') || '[]');
  recs.unshift(rec);
  localStorage.setItem('phil_records', JSON.stringify(recs.slice(0, 100)));
}

function renderHistory() {
  const recs = JSON.parse(localStorage.getItem('phil_records') || '[]')
    .filter(r => r.theme === currentTheme?.label);
  const el = document.getElementById('side-history');
  if (!recs.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="history-label">過去の記録</div>` +
    recs.map(r => `
      <div class="hist-item">
        <div class="hist-meta">${r.date}${r.quote ? `　「${esc(r.quote.slice(0,16))}…」` : ''}</div>
        <div class="hist-text">${esc(r.text)}</div>
      </div>
    `).join('');
}

function today() { return new Date().toLocaleDateString('ja-JP'); }
function esc(s)  { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
