<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哲学大図鑑 — 悩みから探す言葉</title>
<style>
:root {
  --bg: #f5f3ef;
  --accent: #5a7d6a;
  --accent-dark: #3d5e4a;
  --text: #2c2c2c;
  --text-muted: #888;
  --card-bg: #ffffff;
  --border: #ddd8d0;
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
  --shadow-hover: 0 8px 32px rgba(0,0,0,0.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Hiragino Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ===== SCREEN TOGGLE ===== */
.screen { display: none; }
.screen.active { display: block; }
#screen-browse.active { display: flex; flex-direction: column; min-height: 100vh; }
#screen-spider.active { display: flex; flex-direction: column; min-height: 100vh; }

/* ===== HEADER ===== */
.site-header {
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.site-logo {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
}
.site-logo-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
}
.site-header-sub {
  font-size: 12px;
  color: var(--text-muted);
}

/* ===== HERO ===== */
.hero {
  background: var(--accent);
  color: #fff;
  padding: 48px 32px 40px;
  text-align: center;
}
.hero-label {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.75;
  margin-bottom: 10px;
}
.hero-title {
  font-size: clamp(22px, 4vw, 36px);
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 12px;
}
.hero-desc {
  font-size: 14px;
  opacity: 0.85;
  max-width: 480px;
  margin: 0 auto;
  line-height: 1.8;
}
.hero-count {
  display: inline-block;
  margin-top: 20px;
  background: rgba(255,255,255,0.18);
  border-radius: 20px;
  padding: 6px 18px;
  font-size: 13px;
}

/* ===== FILTER TABS ===== */
.filter-bar {
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-tab {
  flex-shrink: 0;
  padding: 14px 20px;
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.filter-tab:hover { color: var(--accent); }
.filter-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 700;
}

/* ===== THEME GRID ===== */
.browse-main {
  flex: 1;
  padding: 40px 48px 64px;
  max-width: 1280px;
  margin: 0 auto;
  width: 100%;
}
.theme-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}
.theme-card {
  background: var(--card-bg);
  border-radius: 14px;
  border: 1.5px solid var(--border);
  padding: 24px 20px 20px;
  cursor: pointer;
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  position: relative;
  overflow: hidden;
}
.theme-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  border-radius: 14px 14px 0 0;
}
.theme-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
  border-color: var(--accent);
}
.theme-card-category {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 10px;
  opacity: 0.6;
}
.theme-card-title {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 12px;
}
.theme-card-meta {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.theme-card-arrow {
  position: absolute;
  bottom: 18px; right: 18px;
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.18s, background 0.18s;
  background: var(--accent);
  color: #fff;
}
.theme-card:hover .theme-card-arrow { opacity: 1; }

/* Category color accents */
.cat-人間関係 .theme-card::before  { background: #5a7d6a; }
.cat-自分自身 .theme-card::before  { background: #7b6ea0; }
.cat-仕事・夢 .theme-card::before  { background: #c08a3a; }
.cat-人生の問い .theme-card::before { background: #3a7ba0; }
.cat-社会・未来 .theme-card::before { background: #a05a6e; }

.cat-人間関係 .theme-card-category  { color: #5a7d6a; }
.cat-自分自身 .theme-card-category  { color: #7b6ea0; }
.cat-仕事・夢 .theme-card-category  { color: #c08a3a; }
.cat-人生の問い .theme-card-category { color: #3a7ba0; }
.cat-社会・未来 .theme-card-category { color: #a05a6e; }

/* ===== SPIDER SCREEN ===== */
.spider-header {
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
.btn-back {
  background: none;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
  white-space: nowrap;
}
.btn-back:hover { border-color: var(--accent); color: var(--accent); }
.spider-header-info { flex: 1; min-width: 0; }
.spider-header-category {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 2px;
}
.spider-header-theme {
  font-size: 17px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.spider-count-badge {
  background: var(--accent);
  color: #fff;
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

.spider-canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  height: 72vh;
  min-height: 620px;
}
#spider-svg {
  width: 100%; height: 100%;
  position: absolute; top: 0; left: 0;
}
.spider-nodes-wrap {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
.spider-center {
  position: absolute;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  z-index: 2;
}
.spider-center-bg {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 160px; height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(245,243,239,0.95) 55%, transparent 100%);
  pointer-events: none;
  z-index: 1;
}
.spider-center-label {
  font-size: clamp(18px, 2.8vw, 28px);
  font-weight: 700;
  line-height: 1.45;
  color: var(--text);
}
.spider-center-hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
  line-height: 1.6;
}
.spider-node {
  position: absolute;
  transform: translate(-50%, -50%);
  background: var(--card-bg);
  border-radius: 50%;
  box-shadow: 0 3px 18px rgba(0,0,0,0.09);
  cursor: pointer;
  pointer-events: all;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  transition: box-shadow 0.22s, transform 0.22s, border-color 0.22s;
  border: 1.5px solid var(--border);
}
.spider-node:hover {
  box-shadow: 0 8px 32px rgba(90,125,106,0.28);
  transform: translate(-50%, -50%) scale(1.07);
  border-color: var(--accent);
  z-index: 20;
}
.node-genre-badge {
  font-size: 9px;
  font-weight: 700;
  border-radius: 10px;
  padding: 2px 7px;
  margin-bottom: 5px;
  color: #fff;
  flex-shrink: 0;
}
.node-text {
  font-size: 11px;
  line-height: 1.5;
  color: var(--text);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
.spider-author-label {
  position: absolute;
  font-size: 11px;
  color: var(--text-muted);
  transform: translate(-50%, -50%);
  pointer-events: none;
  white-space: nowrap;
  background: rgba(245,243,239,0.7);
  padding: 1px 4px;
  border-radius: 4px;
}

/* Genre colors */
.genre-哲学    { background: #5a7d6a; }
.genre-文学    { background: #7b6ea0; }
.genre-仏教    { background: #c08a3a; }
.genre-心理学  { background: #3a7ba0; }
.genre-詩      { background: #a05a6e; }
.genre-日本の古典 { background: #6ea05a; }

/* ===== DETAIL OVERLAY ===== */
#overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(44,44,44,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#overlay.active { display: flex; }
.detail-card {
  background: var(--card-bg);
  border-radius: 18px;
  max-width: 560px;
  width: 100%;
  padding: 40px 36px 32px;
  position: relative;
  box-shadow: 0 12px 56px rgba(0,0,0,0.2);
  max-height: 90vh;
  overflow-y: auto;
}
.detail-close {
  position: absolute; top: 14px; right: 14px;
  background: none; border: none;
  font-size: 22px; cursor: pointer;
  color: var(--text-muted);
  padding: 4px 8px; border-radius: 6px;
  transition: background 0.15s;
}
.detail-close:hover { background: var(--bg); }
.detail-genre-badge {
  display: inline-block;
  font-size: 12px; font-weight: 700;
  border-radius: 12px; padding: 3px 12px;
  color: #fff; margin-bottom: 16px;
}
.detail-quote {
  font-size: clamp(17px, 2.5vw, 22px);
  font-weight: 700;
  line-height: 1.7;
  border-left: 4px solid var(--accent);
  padding-left: 16px;
  margin-bottom: 14px;
}
.detail-source {
  font-size: 13px;
  color: var(--text-muted);
  font-style: italic;
  margin-bottom: 18px;
}
.detail-explanation {
  font-size: 14px;
  line-height: 1.9;
  color: var(--text);
  margin-bottom: 20px;
}
.detail-divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
.detail-prompt { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.detail-input {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  background: var(--bg);
  color: var(--text);
  outline: none;
  min-height: 80px;
  transition: border 0.15s;
}
.detail-input:focus { border-color: var(--accent); }
.detail-save-row { display: flex; justify-content: flex-end; margin-top: 10px; }
.btn-save {
  padding: 10px 22px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 10px;
  font-size: 14px; font-family: inherit;
  font-weight: 600; cursor: pointer;
  transition: background 0.15s;
}
.btn-save:hover { background: var(--accent-dark); }
.status-msg { font-size: 13px; color: var(--text-muted); margin-top: 8px; min-height: 18px; }
.status-msg.ok { color: var(--accent); }

/* ===== PHILOSOPHY SECTION ===== */
.philosophy-section {
  background: var(--card-bg);
  border-top: 1px solid var(--border);
  padding: 32px 28px 40px;
  flex-shrink: 0;
}
.philosophy-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.philosophy-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
.philosophy-textarea {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  background: var(--bg);
  color: var(--text);
  outline: none;
  min-height: 90px;
  transition: border 0.15s;
}
.philosophy-textarea:focus { border-color: var(--accent); }
.philosophy-save-row { display: flex; justify-content: flex-end; margin-top: 10px; }
.philosophy-history { margin-top: 24px; }
.philosophy-history-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; }
.history-entry {
  background: var(--bg);
  border-radius: 10px;
  padding: 13px 16px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
}
.history-entry-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
.history-entry-text { font-size: 13px; line-height: 1.7; }

/* ===== LOADING ===== */
.loading-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(245,243,239,0.85);
  z-index: 300;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
}
.loading-overlay.active { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== PC ONLY ===== */
body { min-width: 1024px; }

/* スマホ向け警告 */
#mobile-warning {
  display: none;
  position: fixed; inset: 0;
  background: #f5f3ef;
  z-index: 9999;
  align-items: center; justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 32px;
  gap: 16px;
}
#mobile-warning.show { display: flex; }
.mobile-warning-icon { font-size: 48px; }
.mobile-warning-title { font-size: 20px; font-weight: 700; }
.mobile-warning-desc { font-size: 14px; color: var(--text-muted); line-height: 1.8; }
</style>
</head>
<body>

<!-- Mobile warning -->
<div id="mobile-warning">
  <div class="mobile-warning-icon">💻</div>
  <div class="mobile-warning-title">パソコンでご覧ください</div>
  <div class="mobile-warning-desc">このアプリはパソコン向けに設計されています。<br>PCブラウザからアクセスしてください。</div>
</div>

<!-- Loading -->
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<!-- ===================== SCREEN: BROWSE ===================== -->
<section class="screen active" id="screen-browse">

  <header class="site-header">
    <div class="site-logo">
      <div class="site-logo-dot"></div>
      哲学大図鑑
    </div>
    <div class="site-header-sub">30の悩み × 300の言葉</div>
  </header>

  <div class="hero">
    <div class="hero-label">Philosophy Database</div>
    <h1 class="hero-title">今の悩みに近い<br>テーマを選んでください</h1>
    <p class="hero-desc">哲学・文学・仏教・心理学など古今東西の言葉が、あなたの悩みに語りかけます</p>
    <div class="hero-count">30テーマ・300の言葉を収録</div>
  </div>

  <nav class="filter-bar" id="filter-bar">
    <button class="filter-tab active" onclick="filterThemes('all')">すべて</button>
    <button class="filter-tab" onclick="filterThemes('人間関係')">人間関係</button>
    <button class="filter-tab" onclick="filterThemes('自分自身')">自分自身</button>
    <button class="filter-tab" onclick="filterThemes('仕事・夢')">仕事・夢</button>
    <button class="filter-tab" onclick="filterThemes('人生の問い')">人生の問い</button>
    <button class="filter-tab" onclick="filterThemes('社会・未来')">社会・未来</button>
  </nav>

  <main class="browse-main">
    <div class="theme-grid" id="theme-grid"></div>
  </main>

</section>

<!-- ===================== SCREEN: SPIDER ===================== -->
<section class="screen" id="screen-spider">

  <div class="spider-header">
    <button class="btn-back" onclick="showBrowse()">← 一覧へ</button>
    <div class="spider-header-info">
      <div class="spider-header-category" id="spider-cat-label"></div>
      <div class="spider-header-theme" id="spider-theme-label"></div>
    </div>
    <div class="spider-count-badge">10の言葉</div>
  </div>

  <div class="spider-canvas-wrap" id="spider-canvas">
    <svg id="spider-svg"></svg>
    <div class="spider-nodes-wrap" id="spider-nodes"></div>
    <div class="spider-center-bg" id="spider-center-bg"></div>
    <div class="spider-center" id="spider-center">
      <div class="spider-center-label" id="spider-center-text"></div>
      <div class="spider-center-hint">言葉をクリックして<br>詳細を読む</div>
    </div>
  </div>

  <div class="philosophy-section">
    <h2 class="philosophy-title">今のあなたの哲学は？</h2>
    <p class="philosophy-subtitle" id="philosophy-subtitle">この言葉たちと向き合って、あなた自身の言葉を残してみてください</p>
    <textarea class="philosophy-textarea" id="philosophy-text" placeholder="感じたこと、気づいたことを自由に書いてください…"></textarea>
    <div class="philosophy-save-row">
      <button class="btn-save" onclick="savePhilosophy()">保存する</button>
    </div>
    <div class="philosophy-history" id="philosophy-history"></div>
  </div>

</section>

<!-- ===================== DETAIL OVERLAY ===================== -->
<div id="overlay" onclick="closeOverlay(event)">
  <div class="detail-card">
    <button class="detail-close" onclick="closeOverlay()">×</button>
    <div class="detail-genre-badge" id="d-genre"></div>
    <div class="detail-quote" id="d-quote"></div>
    <div class="detail-source" id="d-source"></div>
    <div class="detail-explanation" id="d-explanation"></div>
    <hr class="detail-divider">
    <div class="detail-prompt">この言葉について、あなたの考えを</div>
    <textarea class="detail-input" id="detail-input" placeholder="この言葉を読んで、あなたはどう思いますか？"></textarea>
    <div class="detail-save-row">
      <button class="btn-save" onclick="saveDetailNote()">振り返りを保存</button>
    </div>
    <div class="status-msg" id="detail-status"></div>
  </div>
</div>

<script>
// ===== DATA =====
const CATEGORIES = {
  人間関係: ['comparison','loneliness','people_pleasing','unforgiving','jealousy','relationship_reset','cant_be_honest'],
  自分自身:  ['identity_lost','no_confidence','self_dislike','emotional_control','perfectionism','past_regret'],
  '仕事・夢': ['work_meaningless','career_change','effort_unrewarded','work_purpose','dream_abandon','no_purpose'],
  人生の問い: ['life_meaning','happiness_unknown','death_thoughts','time_wasted','choice_regret'],
  '社会・未来': ['world_dissatisfaction','money_happiness','ai_era','no_correct_answer','powerlessness','fear_of_change'],
};

// reverse map: themeId → category
const THEME_CATEGORY = {};
for (const [cat, ids] of Object.entries(CATEGORIES)) ids.forEach(id => THEME_CATEGORY[id] = cat);

let DB = null;
let currentThemeId = null;
let currentThemeLabel = null;
let currentCategory = null;
let currentDetailEntry = null;

// Seeded LCG random — same theme always gets same layout
function makeRng(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = Math.imul(s, 1664525) + 1013904223 | 0; return (s >>> 0) / 0xffffffff; };
}
function hashStr(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = (Math.imul(h, 31) + str.charCodeAt(i)) | 0;
  return h >>> 0;
}

// ===== INIT =====
window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('loading').classList.add('active');
  try {
    const res = await fetch('./philosophy-database.json');
    if (res.ok) DB = await res.json();
  } catch(e) { console.warn('DB load failed:', e); }
  document.getElementById('loading').classList.remove('active');
  buildGrid('all');
});

// ===== THEME GRID =====
function buildGrid(filterCat) {
  // update tab active state
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  event && event.currentTarget && event.currentTarget.classList.add('active');

  if (!DB) return;
  const grid = document.getElementById('theme-grid');
  grid.innerHTML = '';

  DB.themes.forEach(theme => {
    const cat = THEME_CATEGORY[theme.id] || 'その他';
    if (filterCat !== 'all' && cat !== filterCat) return;

    const count = DB.entries.filter(e => e.theme_id === theme.id).length;

    const card = document.createElement('div');
    card.className = `theme-card cat-${cat}`;
    card.innerHTML = `
      <div class="theme-card-category">${cat}</div>
      <div class="theme-card-title">${theme.label}</div>
      <div class="theme-card-meta">
        <span>${count}の言葉</span>
      </div>
      <div class="theme-card-arrow">→</div>
    `;
    card.onclick = () => showSpider(theme.id, theme.label, cat);
    grid.appendChild(card);
  });
}

function filterThemes(cat) {
  // update active tab manually (event may be synthetic)
  document.querySelectorAll('.filter-tab').forEach(t => {
    const label = t.textContent;
    const match = cat === 'all' ? label === 'すべて' : label === cat;
    t.classList.toggle('active', match);
  });
  buildGrid(cat);
}

// ===== SPIDER MAP =====
function showSpider(themeId, themeLabel, cat) {
  currentThemeId = themeId;
  currentThemeLabel = themeLabel;
  currentCategory = cat;

  document.getElementById('spider-cat-label').textContent = cat;
  document.getElementById('spider-theme-label').textContent = themeLabel;
  document.getElementById('spider-center-text').textContent = themeLabel;
  document.getElementById('philosophy-subtitle').textContent =
    `「${themeLabel}」について、あなた自身の言葉を残してみてください`;

  zoomLevel = 1; panX = 0; panY = 0;
  showScreen('spider');
  renderSpider();
  renderHistory();
}

function showBrowse() {
  showScreen('browse');
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (name === 'spider') {
    // wait for layout then render
    requestAnimationFrame(() => renderSpider());
  }
}

function renderSpider() {
  if (!DB || !currentThemeId) return;
  const entries = DB.entries.filter(e => e.theme_id === currentThemeId);

  const canvas = document.getElementById('spider-canvas');
  const W = canvas.offsetWidth  || 900;
  const H = canvas.offsetHeight || 600;
  const cx = W / 2, cy = H / 2;

  const svg = document.getElementById('spider-svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Subtle concentric rings
  const ringStep = Math.min(W, H) * 0.14;
  for (let r = ringStep; r < Math.min(W, H) * 0.52; r += ringStep) {
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
    c.setAttribute('fill','none'); c.setAttribute('stroke','#e8e4de'); c.setAttribute('stroke-width','1');
    svg.appendChild(c);
  }

  const nodesWrap = document.getElementById('spider-nodes');
  nodesWrap.innerHTML = '';

  // Position center elements
  const centerEl = document.getElementById('spider-center');
  centerEl.style.left = cx + 'px'; centerEl.style.top = cy + 'px';
  const centerBg = document.getElementById('spider-center-bg');
  centerBg.style.left = cx + 'px'; centerBg.style.top = cy + 'px';

  // Seeded randomness for organic but stable layout
  const rng = makeRng(hashStr(currentThemeId));

  // Node size pattern: 3 sizes for visual rhythm
  const nodeSizes = [130, 105, 155, 105, 130, 110, 150, 105, 130, 110];

  // Radius range: use more of the canvas
  const short = Math.min(W, H);
  const rMin = short * 0.27;
  const rMax = short * 0.46;

  // Base angles evenly distributed, then add organic offset
  const positions = entries.map((_, i) => {
    const baseAngle = (2 * Math.PI * i / entries.length) - Math.PI / 2;
    const angleJitter = (rng() - 0.5) * 0.55;  // ±0.275 rad ≈ ±16°
    const angle = baseAngle + angleJitter;
    const radius = rMin + rng() * (rMax - rMin);
    const ns = nodeSizes[i % nodeSizes.length];
    const pad = ns / 2 + 16;
    let nx = cx + radius * Math.cos(angle);
    let ny = cy + radius * Math.sin(angle);
    nx = Math.max(pad, Math.min(W - pad, nx));
    ny = Math.max(pad, Math.min(H - pad, ny));
    return { nx, ny, angle, radius };
  });

  // Draw lines (behind nodes)
  positions.forEach(({ nx, ny }) => {
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', nx); line.setAttribute('y2', ny);
    line.setAttribute('stroke','#d8d3cb'); line.setAttribute('stroke-width','1');
    svg.appendChild(line);
  });

  // Draw nodes + author labels
  entries.forEach((entry, i) => {
    const { nx, ny, angle, radius } = positions[i];
    const ns = nodeSizes[i % nodeSizes.length];

    // Author label: midpoint of line, slightly offset perpendicular
    const lx = cx + radius * 0.56 * Math.cos(angle);
    const ly = cy + radius * 0.56 * Math.sin(angle);
    const al = document.createElement('div');
    al.className = 'spider-author-label';
    al.style.left = lx + 'px';
    al.style.top  = ly + 'px';
    al.textContent = entry.author;
    nodesWrap.appendChild(al);

    // Node circle
    const node = document.createElement('div');
    node.className = 'spider-node';
    node.style.left = nx + 'px';
    node.style.top  = ny + 'px';
    node.style.width  = ns + 'px';
    node.style.height = ns + 'px';

    const badge = document.createElement('div');
    badge.className = 'node-genre-badge genre-' + entry.genre;
    badge.textContent = entry.genre;

    const txt = document.createElement('div');
    txt.className = 'node-text';
    // Fit text to node size
    const maxChars = Math.floor(ns / 5.5);
    txt.textContent = entry.text.length > maxChars ? entry.text.slice(0, maxChars - 1) + '…' : entry.text;

    node.appendChild(badge);
    node.appendChild(txt);
    node.onclick = () => openDetail(entry);
    nodesWrap.appendChild(node);
  });
}

window.addEventListener('resize', () => {
  if (document.getElementById('screen-spider').classList.contains('active')) renderSpider();
});

// ===== DETAIL OVERLAY =====
function openDetail(entry) {
  currentDetailEntry = entry;
  document.getElementById('d-genre').textContent  = entry.genre;
  document.getElementById('d-genre').className    = 'detail-genre-badge genre-' + entry.genre;
  document.getElementById('d-quote').textContent  = entry.text;
  document.getElementById('d-source').textContent = `${entry.author}（『${entry.source}』${entry.year}）`;
  document.getElementById('d-explanation').textContent = entry.explanation;
  document.getElementById('detail-input').value   = '';
  document.getElementById('detail-status').textContent = '';
  document.getElementById('overlay').classList.add('active');
}

function closeOverlay(e) {
  if (!e || e.target === document.getElementById('overlay')) {
    document.getElementById('overlay').classList.remove('active');
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

function saveDetailNote() {
  const text = document.getElementById('detail-input').value.trim();
  if (!text || !currentDetailEntry) return;

  const records = JSON.parse(localStorage.getItem('philosophy_records') || '[]');
  records.unshift({
    date:  new Date().toLocaleDateString('ja-JP'),
    theme: currentThemeLabel,
    quote: currentDetailEntry.text,
    author: currentDetailEntry.author,
    text:  text,
  });
  localStorage.setItem('philosophy_records', JSON.stringify(records.slice(0, 100)));
  document.getElementById('detail-status').textContent = '保存しました';
  document.getElementById('detail-status').className   = 'status-msg ok';
  renderHistory();
}

// ===== PERSONAL PHILOSOPHY =====
function savePhilosophy() {
  const text = document.getElementById('philosophy-text').value.trim();
  if (!text) return;

  const records = JSON.parse(localStorage.getItem('philosophy_records') || '[]');
  records.unshift({
    date:  new Date().toLocaleDateString('ja-JP'),
    theme: currentThemeLabel,
    text:  text,
  });
  localStorage.setItem('philosophy_records', JSON.stringify(records.slice(0, 100)));
  document.getElementById('philosophy-text').value = '';
  renderHistory();
}

function renderHistory() {
  const records = JSON.parse(localStorage.getItem('philosophy_records') || '[]');
  const themed  = records.filter(r => r.theme === currentThemeLabel);
  const el = document.getElementById('philosophy-history');
  if (!themed.length) { el.innerHTML = ''; return; }

  el.innerHTML = `<div class="philosophy-history-title">このテーマの記録</div>` +
    themed.map(r => `
      <div class="history-entry">
        <div class="history-entry-meta">${r.date}${r.quote ? `　「${esc(r.quote.slice(0,20))}…」への感想` : ''}</div>
        <div class="history-entry-text">${esc(r.text)}</div>
      </div>
    `).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// モバイル検出
(function() {
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
    || window.innerWidth < 768;
  if (isMobile) document.getElementById('mobile-warning').classList.add('show');
})();
</script>
